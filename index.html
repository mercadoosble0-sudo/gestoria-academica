<!DOCTYPE html>
<html>
<head>
<title>Gestoria Academica</title>
<style>
body{font-family: Arial; background: #f0f4f8; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.login-box{background:white; padding:40px; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.1); width:320px; text-align:center;}
h2{color:#2c3e50; margin-bottom:5px;}
p{color:#7f8c8d; margin-bottom:20px;}
input{width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box;}
.btn{display:block; width:100%; padding:12px; background:#3498db; color:white; text-decoration:none; border-radius:8px; margin-top:15px; font-weight:bold;}
.btn:hover{background:#2980b9;}
</style>
</head>
<body>
<div class="login-box">
<h2>Gestoria Academica</h2>
<p>Inicio de sesion</p>
<input type="text" placeholder="Usuario del padre">
<input type="password" placeholder="Contraseña">
<a class="btn" href="dashboard.html">Ingresar</a>
</div>
</body>
</html>
